.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.chip.no{background:var(--errbg);color:var(--err);border-color:transparent}.chip.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}

button.btn.sec{background:transparent;color:var(--brand);border:1px solid var(--brand)}button.btn:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;border:0;color:var(--brand);cursor:pointer;font:inherit;text-decoration:underline;padding:0}
input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
label.f{display:block;margin:10px 0 2px;font-size:14px;color:var(--mute)}
.msg{border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.err{background:var(--errbg);color:var(--err)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.steps span{padding:4px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--mute)}

.out a{display:block;padding:8px 0;border-top:1px solid var(--line);color:var(--brand);text-decoration:none;word-break:break-all}
.muted{color:var(--mute);font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px}

needSheet:"Hãy đọc sheet trước",needTpl:"Hãy chọn file mẫu pptx",noOut:"Chưa có file nào",period:"Kỳ dữ liệu",logfile:"nhat_ky.txt",skipNo:"Không có mẫu quảng cáo được tick, bỏ qua",imgNone:"Không có ảnh",imgFail:"Tải ảnh thất bại",slides:"slide"}};
var lang="ko",S=null,SHEET=null,sel={},outputs=[],imgCache={},TPL_FALLBACK=false;
try{var sv=localStorage.getItem("lang");lang=sv||((navigator.language||"").slice(0,2)=="vi"?"vi":"ko")}catch(e){}
function t(k){return (T[lang]&&T[lang][k])||T.ko[k]||k}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(i){return document.getElementById(i)}
function toggle(i){var e=$(i);e.hidden=!e.hidden}
function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){}applyLang();render()}
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.getAttribute("data-t"))});$("l-ko").className=lang=="ko"?"on":"";$("l-vi").className=lang=="vi"?"on":"";document.title=t("title")}
function call(fn){var args=[].slice.call(arguments,1);return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(new Error(e.message||String(e)))});r[fn].apply(r,args)})}
function chip(cls,txt){return '<span class="chip '+cls+'">'+esc(txt)+'</span>'}
function z(n){return (n<10?"0":"")+n}

function load(){call("getState").then(function(s){S=s;render()}).catch(function(e){$("runmsg").innerHTML='<div class="msg err">'+esc(e.message)+'</div>'})}
function render(){
 if(!S)return;
 $("ver").textContent="v"+S.version;$("who").textContent=S.user||"";
 var h=chip(S.hasToken?"ok":"no",(S.hasToken?"✓ ":"✗ ")+(S.hasToken?t("tokenOk"):t("tokenNo")));
 Object.keys(S.accounts).forEach(function(c){if(S.accounts[c])h+=chip("ok","✓ "+t("acct")+" "+c)});
 if(S.issued)h+=chip(S.tokenDays>=50?"warn":"ok",t("issued")+" "+S.issued+(S.tokenDays!==null?" ("+S.tokenDays+"d)":""));
 h+=chip(S.hasTemplate?"ok":"warn",S.hasTemplate?"✓ "+t("tplOk")+" (Drive)":"– "+t("tplNo")+" (Drive)");
 h+=chip(embeddedTemplate()?"ok":"warn",embeddedTemplate()?"✓ "+t("tplOk")+" ("+CR_TEMPLATE_NAME+")":"– "+t("tplNo")+" (template_js)");
 $("envchips").innerHTML=h;$("tplbox").hidden=S.hasTemplate&&!TPL_FALLBACK;
 var cs=SHEET?uniq(SHEET.tabs.map(function(x){return x.cc})):[],ch="";
 cs.forEach(function(c){if(sel[c]===undefined)sel[c]=true;ch+='<label class="chip ok" style="cursor:pointer"><input type="checkbox" '+(sel[c]?"checked":"")+' onchange="sel[\''+c+'\']=this.checked;render()"> '+c+'</label>'});
 $("cc").innerHTML=ch||'<span class="muted">—</span>';
 var chosen=cs.filter(function(c){return sel[c]});
 $("btnRun").disabled=!chosen.length||RUNNING;
 renderOuts();
}
function uniq(a){var s={},o=[];a.forEach(function(x){if(!s[x]){s[x]=1;o.push(x)}});return o}
function doCheck(){$("btnCheck").disabled=true;$("checkres").innerHTML='<div class="muted">…</div>';
 var cs=SHEET?uniq(SHEET.tabs.map(function(x){return x.cc})).filter(function(c){return sel[c]}):Object.keys(S.accounts).filter(function(c){return S.accounts[c]});
 call("checkConnection",cs).then(function(r){$("checkres").innerHTML=r.map(function(x){var c=x.level=="오류"?"err":x.level=="주의"?"warn":"ok";return '<div class="msg '+c+'">'+esc(lang=="vi"?x.vi:x.ko)+'</div>'}).join("")})
 .catch(function(e){$("checkres").innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}).then(function(){$("btnCheck").disabled=false})}
function doDiag(){$("diagres").hidden=false;$("diagres").textContent="…";call("diagnose").then(function(r){$("diagres").textContent=r}).catch(function(e){$("diagres").textContent="진단 호출 실패: "+e.message})}
// 양식을 조각으로 받는다 (큰 값 한 번에 받다 끊기는 것 방지)
// 양식 우선순위: 직접 고른 파일 > 드라이브(TEMPLATE_FILE_ID, 실패하면 건너뜀) > 코드에 포함된 양식(template_js)
function embeddedTemplate(){return (typeof CR_TEMPLATE_B64==="string"&&CR_TEMPLATE_B64.length>1000)?b64buf(CR_TEMPLATE_B64):null}
function fetchTemplate(){
 var emb=embeddedTemplate();
 if(!S.hasTemplate){if(emb){log("양식: 코드에 포함된 "+CR_TEMPLATE_NAME+" 사용");return Promise.resolve(emb)}return Promise.reject(new Error(t("needTpl")))}
 return fetchTemplateDrive().then(function(buf){log("양식: 드라이브 파일 사용");return buf}).catch(function(e){
  if(emb){log("양식: 드라이브 읽기 실패("+e.message+") → 코드에 포함된 "+CR_TEMPLATE_NAME+" 사용");return emb}throw e})}
function fetchTemplateDrive(){return call("getTemplateInfo").then(function(info){
 if(!info)throw new Error(t("needTpl"));if(info.error)throw new Error(info.error);
 if(!/presentationml/.test(info.mime||""))throw new Error("드라이브의 양식이 pptx 가 아닙니다 ("+info.mime+"). 원본 pptx 를 다시 올려 주세요");
 var parts=[],chain=Promise.resolve();
 for(var i=0;i<info.chunks;i++)(function(i){chain=chain.then(function(){return call("getTemplateChunk",i).then(function(c){if(c.error)throw new Error(c.error);parts.push(c.b64)})})})(i);
 return chain.then(function(){var bufs=parts.map(b64buf),total=bufs.reduce(function(a,b){return a+b.byteLength},0),out=new Uint8Array(total),o=0;bufs.forEach(function(b){out.set(new Uint8Array(b),o);o+=b.byteLength});
  if(total!==info.size)throw new Error("양식 전송 크기 불일치 "+total+"/"+info.size);return out.buffer})})}
function importSheet(){var u=$("sheeturl").value.trim();if(!u)return;$("btnSheet").disabled=true;$("sheetmsg").innerHTML='<div class="muted">'+t("importing")+'</div>';$("tabs").innerHTML="";
 call("readTabs",u).then(function(r){SHEET=r;sel={};var p=r.period;
  $("sheetmsg").innerHTML='<div class="msg ok">'+t("imported")+': '+esc(r.title)+' · '+t("period")+' '+z(p[0])+'/'+z(p[1])+' - '+z(p[2])+'/'+z(p[3])+'</div>';
  $("tabs").innerHTML=r.tabs.map(function(x){return '<li>'+chip("ok","✓ "+x.cc+" "+x.kind)+'<span>'+esc(x.name)+'</span><span class="muted">'+x.rows.length+' rows</span></li>'}).join("");render()})
 .catch(function(e){SHEET=null;$("sheetmsg").innerHTML='<div class="msg err">'+esc(e.message)+'</div>';render()}).then(function(){$("btnSheet").disabled=false})}

// ---- 생성
var RUNNING=false,LOG=[];
function log(s){LOG.push(s);$("log").textContent=LOG.join("\n");$("log").scrollTop=$("log").scrollHeight}
function step(i){for(var k=1;k<=3;k++)$("st"+k).className=k<i?"done":k==i?"cur":""}
function reportYear(em,ed,today){var y=today.getFullYear();return new Date(y,em-1,ed)>today?y-1:y}
function readFileBuf(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=function(){rej(new Error("파일을 읽지 못함"))};fr.readAsArrayBuffer(file)})}
function b64buf(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
function cropSquarePng(mime,b64){return new Promise(function(res,rej){var im=new Image();im.onload=function(){var s=Math.min(im.naturalWidth,im.naturalHeight),c=document.createElement("canvas");c.width=c.height=s;
 c.getContext("2d").drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,s,s);c.toBlob(function(b){b?b.arrayBuffer().then(res):rej(new Error("crop"))},"image/png")};im.onerror=function(){rej(new Error("이미지를 열지 못함"))};im.src="data:"+mime+";base64,"+b64})}
function download(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},3000);return a.href}
function renderOuts(){$("outs").innerHTML=outputs.length?outputs.map(function(o){return '<a href="'+o.url+'" download="'+esc(o.name)+'">⬇ '+esc(o.name)+' <span class="muted">('+Math.max(1,Math.round(o.size/1024))+' KB)</span></a>'}).join(""):'<div class="muted">'+t("noOut")+'</div>'}
function doRun(){
 if(!SHEET){$("runmsg").innerHTML='<div class="msg warn">'+t("needSheet")+'</div>';return}
 var pickedTpl=$("tplfile").files[0]||null;
 if(!S.hasTemplate&&!pickedTpl&&!embeddedTemplate()){$("tplbox").hidden=false;$("runmsg").innerHTML='<div class="msg warn">'+t("needTpl")+'</div>';return}
 RUNNING=true;LOG=[];outputs.forEach(function(o){URL.revokeObjectURL(o.url)});outputs=[];render();$("prog").hidden=false;$("runmsg").innerHTML='<div class="msg warn">'+t("running")+'</div>';$("imgtxt").textContent="";$("imgbar").style.width="0";
 var skip=$("skipfetch").checked,chosen=uniq(SHEET.tabs.map(function(x){return x.cc})).filter(function(c){return sel[c]});
 var p=SHEET.period,today=new Date(),year=reportYear(p[2],p[3],today),sy=p[0]<=p[2]?year:year-1;
 var meta={yy:z(year%100),mm:p[2],created:{month:today.getMonth()+1,day:today.getDate()},period:p};
 var periodIso=[sy+"-"+z(p[0])+"-"+z(p[1]),year+"-"+z(p[2])+"-"+z(p[3])];
 step(1);
 var plans=[];
 SHEET.tabs.forEach(function(tab){if(chosen.indexOf(tab.cc)<0)return;
  try{var plan=CRPlan.planDeck(tab.cc,tab.kind,CRPlan.parseBlocks(tab.rows),CR_LABELS);
   if(!plan.slides.length){log("["+tab.cc+" "+tab.kind+"] "+t("skipNo"));return}
   plans.push({cc:tab.cc,kind:tab.kind,plan:plan})}
  catch(e){log("["+tab.cc+" "+tab.kind+"] 오류: "+e.message)}});
 var names=[],seen={};plans.forEach(function(x){x.plan.slides.forEach(function(s){s.slots.forEach(function(sl){var k=sl.name.toLowerCase();if(!seen[k]){seen[k]=1;names.push({cc:x.cc,name:sl.name})}})})});
 // 양식: 직접 고른 파일이 있으면 그것을, 아니면 드라이브(getTemplate). 드라이브 읽기가 실패하면 파일 고르기 칸을 열고 안내
 var tplP=pickedTpl?readFileBuf(pickedTpl).then(function(b){log("양식: 직접 고른 파일 사용");return b}):fetchTemplate()
  .catch(function(e){TPL_FALLBACK=true;$("tplbox").hidden=false;$("tplnote").textContent=t("tplFail");throw new Error(t("tplFail")+" ("+e.message+")")});
 tplP.then(function(tplBuf){
  step(2);var done=0,total=skip?0:names.length;
  function prog(){$("imgtxt").textContent=total?t("imgs")+" "+done+" / "+total:"";$("imgbar").style.width=total?Math.min(100,100*done/total)+"%":"100%"}
  prog();
  var chain=Promise.resolve();
  if(!skip)names.forEach(function(n){chain=chain.then(function(){var k=n.name.toLowerCase();if(imgCache[k])return;
   return call("fetchImage",n.cc,n.name,periodIso).then(function(r){if(!r.found){log(t("imgNone")+": "+n.name);return}return cropSquarePng(r.mime,r.b64).then(function(png){imgCache[k]=png;log("이미지: "+n.name+" ← "+r.adName+" ["+r.kind+"]")})})
   .catch(function(e){log(t("imgFail")+": "+n.name+" — "+e.message)}).then(function(){done++;prog()})})});
  return chain.then(function(){
   step(3);var images={find:function(n){return skip?null:(imgCache[n.toLowerCase()]||null)}};
   var seq=Promise.resolve();
   plans.forEach(function(x){seq=seq.then(function(){var local=[];
    return CRBuild.buildDeck(x.plan,tplBuf.slice(0),meta,images,local).then(function(blob){
     var name="SKIN1004_"+meta.yy+"-"+z(meta.mm)+"_EAST_"+x.cc+"_"+x.kind+".pptx";var url=download(blob,name);outputs.push({name:name,size:blob.size,url:url});
     log("["+x.cc+" "+x.kind+"] "+t("slides")+" "+CRBuild.slideCount(x.plan)+" → "+name);
     x.plan.warnings.forEach(function(w){log("   경고: "+w)});x.plan.infos.forEach(function(w){log("   참고: "+w)});local.forEach(function(w){log("   "+w)});renderOuts()})})});
   return seq;
  });
 }).then(function(){var lb=new Blob([LOG.join("\n")+"\n"],{type:"text/plain;charset=utf-8"});outputs.push({name:t("logfile"),size:lb.size,url:URL.createObjectURL(lb)});renderOuts();
   $("runmsg").innerHTML='<div class="msg ok">'+t("done")+'</div>';for(var k=1;k<=3;k++)$("st"+k).className="done"})
 .catch(function(e){log("오류: "+e.message);$("log").hidden=false;$("runmsg").innerHTML='<div class="msg err">'+t("fail")+'</div>'})
 .then(function(){RUNNING=false;render()});
}
applyLang();load();
