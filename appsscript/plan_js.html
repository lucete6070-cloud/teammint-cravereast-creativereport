<script>
/**
 * 시트 값(2차원 배열, '표시된 값' 그대로) → 블록 파싱 → 슬라이드 계획.
 * 파이썬 src/sheet.py + src/plan.py + src/plan_br.py 를 그대로 옮긴 것. 숫자는 시트 문자열 그대로(재계산·반올림 없음).
 * 브라우저와 Node 양쪽에서 동작 (Node 비교 테스트용 module.exports 포함).
 */
(function (root) {
  var LEFT_COL = 1, RIGHT_COL = 16, THIRD_COL = 31, MAX_COLS = 48;   // THIRD_COL: ID 탭의 Tokopedia PUR 블록
  var STD_ATC_MEMO = /^>\s*유입\s*효율\s*(우수|저조)\s*$/;

  function pad(rows) {
    return rows.map(function (r) { r = (r || []).map(function (v) { return v == null ? '' : String(v); }); while (r.length < MAX_COLS) r.push(''); return r; });
  }
  function isNa(v) { v = (v || '').trim(); return v === '#N/A' || v === ''; }

  // ---------------- sheet.py: parse_blocks
  function parseBlocks(rawRows) {
    var rows = pad(rawRows), blocks = [];
    [['L', LEFT_COL], ['R', RIGHT_COL], ['T', THIRD_COL]].forEach(function (sc) {
      var side = sc[0], st = sc[1];
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        if (r[st] !== 'TOP 10') continue;
        var hdr = [], c = st + 1;
        while (c < MAX_COLS && r[c].trim()) { hdr.push(r[c].trim()); c++; }
        var metrics = hdr.slice(0, hdr.length - 2), n = metrics.length;
        var detail = (rows[i - 2] ? rows[i - 2][st + 1] : '').trim();
        var campaign = (rows[i - 1] ? rows[i - 1][st + 1] : '').trim();
        var noteCells = (rows[i - 1] ? rows[i - 1].slice(st + 2, st + 14) : []).filter(function (x) { return x.trim() && x.trim() !== '* PPT 삽입 기준'; });
        var data = [];
        for (var j = i + 1; j < Math.min(i + 12, rows.length); j++) {
          var q = rows[j];
          if (!q[st].trim() && !q[st + 1].trim()) break;
          if (q[st] === 'TOP 10') break;
          if (isNa(q[st])) continue;
          var cells = {};
          for (var k = 0; k < n; k++) cells[metrics[k]] = q[st + 1 + k];
          data.push({ key: q[st - 1], name: q[st].trim(), cells: cells,
                      hi: q[st + 1 + n].trim().toUpperCase() === 'TRUE', lo: q[st + 2 + n].trim().toUpperCase() === 'TRUE',
                      memo: (st + 3 + n < MAX_COLS) ? q[st + 3 + n].trim() : '', order: metrics });
        }
        blocks.push({ side: side, detail: detail, campaign: campaign, rows: data, headers: metrics,
                      na_only: isNa(campaign) && !data.length, note: noteCells.map(function (x) { return x.trim(); }).join(' '),
                      flags: hdr.slice(hdr.length - 2) });   // 체크 열 이름 (BR: '소진량 최상위 / 유입 고효율 소재' 일 때도 있음)
      }
    });
    return blocks;
  }

  // ---------------- plan.py
  function campaignStart(campaign) { var m = /_(\d{6})_(\d{6}|NONE)$/.exec(campaign.trim()); return m ? m[1] : '999999'; }
  function alias(cfg, which, cc, kind, side, detail) {
    var m = ((cfg[which] || {})[cc] || {})[kind] || {};
    return m[side + ':' + detail] || m[detail] || null;
  }
  function roasValue(row) { var v = (row.cells['ROAS'] || '').replace(/[^0-9.]/g, ''); return v ? parseFloat(v) : -1.0; }
  function need(row, key) {
    if (!(key in row.cells)) throw new Error("시트에 '" + key + "' 열이 없습니다 (소재: " + row.name.slice(0, 40) + "…). 시트 양식이 바뀌었는지 확인해 주세요.");
    return row.cells[key];
  }
  function kpiText(sideKind, row) {
    var spend = need(row, '지출금액'), roas = need(row, 'ROAS');
    if (sideKind === 'atc') return ['지출 ' + spend, '장바구니 CPA ' + need(row, 'CPA(장바구니 담기)') + ' / ROAS ' + roas];
    return ['지출 ' + spend, '구매 CVR ' + need(row, 'CVR(구매)') + ' / ROAS ' + roas];
  }
  function isCatalog(row) { return row.name.toLowerCase().indexOf('catalog') >= 0; }
  function orderedBlocks(blocks, side) {
    var bl = blocks.filter(function (b) { return b.side === side && !b.na_only && b.rows.length; });
    return bl.map(function (b, i) { return [b, i]; }).sort(function (a, b) {   // 안정 정렬
      var ka = campaignStart(a[0].campaign), kb = campaignStart(b[0].campaign);
      return ka < kb ? -1 : ka > kb ? 1 : a[1] - b[1];
    }).map(function (x) { return x[0]; });
  }
  function pick(blocks, side, which, kpiKind, cfg, cc, kind, warnings) {
    var items = [];
    orderedBlocks(blocks, side).forEach(function (b) { b.rows.forEach(function (r) {
      var flag = which === 'hi' ? r.hi : r.lo;
      if (flag && !isCatalog(r)) items.push([b, r]);
    }); });
    if (items.length > 5) {
      var best = {};
      items.forEach(function (it) { var k = it[0].detail; if (!(k in best) || roasValue(it[1]) > roasValue(best[k][1])) best[k] = it; });
      var reduced = items.filter(function (it) { return best[it[0].detail][1] === it[1]; });
      var dropped = items.filter(function (it) { return best[it[0].detail][1] !== it[1]; }).map(function (it) { return it[1].name; });
      warnings.push((which === 'hi' ? '우수' : '저조') + ' ' + items.length + '개 > 5: 캠페인디테일당 ROAS 최고 1개만 남김 (제외: ' + dropped.map(function (d) { return d.slice(0, 36) + '…'; }).join(', ') + ')');
      items = reduced;
      if (items.length > 5) { warnings.push('그래도 ' + items.length + '개 > 5: 앞의 5개만 사용'); items = items.slice(0, 5); }
    }
    return items.map(function (it) { var b = it[0], r = it[1];
      return { label: alias(cfg, 'card_label', cc, kind, side, b.detail) || b.detail, kpi: kpiText(kpiKind, r), name: r.name, cls: which, detail: b.detail, side: side }; });
  }
  function tableSpecs(blocks, sides, cfg, cc, kind) {
    var specs = [];
    sides.forEach(function (side) { orderedBlocks(blocks, side).forEach(function (b) {
      if (!b.rows.some(function (r) { return r.hi || r.lo; })) return;
      var label = alias(cfg, 'table_label', cc, kind, side, b.detail) || ((kind === 'OG' && side === 'L') ? 'ATC' : side === 'T' ? 'Tokopedia ' + b.detail : b.detail);
      // 표에는 카탈로그 소재도 넣는다 (10월 SG RT FN 확인). 카드에서만 뺀다
      var rows = b.rows.map(function (r) {
        return [r.name, b.headers.map(function (h) { return r.cells[h]; }), r.hi ? 'hi' : (r.lo ? 'lo' : '')]; });
      specs.push({ label: label, headers: b.headers, rows: rows });
    }); });
    return specs;
  }
  function slide(title, slots, extra) { var s = { title: title, slots: slots, n_hi: 0, n_lo: 0, split: false, group_labels: [] }; if (extra) for (var k in extra) s[k] = extra[k]; return s; }

  // ---------------- plan_br.py : PR&BR 탭 오른쪽(BR) 블록 → BR 슬라이드
  // 카드 = [Partnership_계정] + KPI. 소진량만 만원(소수 1자리, 반올림) — CLAUDE.md 규칙 1 의 유일한 예외 (26-11-04 지윤님 결정)
  var BR_MAX = 5;
  var BR_TYPE_TEXT = { 'in': '유입 효율 (CTR, CPC)', both: '유입 & 구매 효율', pur: '구매 효율(ROAS)' }, BR_TYPE_ORDER = { 'in': 0, both: 1, pur: 2 };
  function manWon(spend) {
    var d = (spend || '').replace(/[^0-9.]/g, '');
    if (!d) return null;
    // 반올림(ROUND_HALF_UP)을 정수 연산으로: 원 → 천원 단위 반올림 후 만원 소수 1자리
    var won = Math.round(parseFloat(d)), tenth = Math.floor((won + 500) / 1000);   // 0.1만원 단위 개수
    var whole = Math.floor(tenth / 10), dec = tenth % 10;
    return String(whole).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + dec + '만원';
  }
  function won(v) { return v.replace(/₩/g, '').trim() + '원'; }
  function count(v) { return v.replace(/₩/g, '').trim() + '건'; }
  function accountLabel(name, withLength) {
    var toks = name.split('_'), i = -1;
    for (var k = 0; k < toks.length; k++) if (toks[k].toLowerCase() === 'partnership') { i = k; break; }
    if (i < 0) return null;
    var rest = toks.slice(i + 1), acc = [], len = null;
    for (var j = 0; j < rest.length; j++) {
      if (/^\d+x\d+$/.test(rest[j])) { var nx = rest[j + 1] || ''; if (/^(\d+m)?\d+s$/.test(nx)) len = nx; break; }
      acc.push(rest[j]);
    }
    if (!acc.length) return null;
    return '[Partnership_' + acc.join('_') + (withLength && len ? '_' + len : '') + ']';
  }
  function classifyMemo(memo, cls) {
    var m = (memo || '').replace(/\s/g, ''), hasIn = /유입|CTR|CPC/.test(m), hasPur = /구매|ROAS/.test(m), warn = null, typ;
    if (hasIn && hasPur) typ = 'both'; else if (hasIn) typ = 'in'; else if (hasPur) typ = 'pur';
    else { typ = 'both'; warn = "메모에 유입/구매 구분이 없어 '유입 & 구매 효율'로 분류"; }
    var good = m.indexOf('우수') >= 0, bad = m.indexOf('저조') >= 0;
    if (good !== bad && (good ? 'hi' : 'lo') !== cls) warn = "메모('" + memo + "')와 체크 열이 반대 — 체크 열 기준으로 '" + (cls === 'hi' ? '우수' : '저조') + "' 처리";
    return [typ, cls, warn];
  }
  function brKpi(typ, row) {
    var sp = '소진량 ' + (manWon(need(row, '지출금액')) || need(row, '지출금액'));
    if (typ === 'in') return [sp + ' / CTR ' + need(row, 'CTR') + ' / CPC ' + won(need(row, 'CPC'))];
    if (typ === 'pur') return [sp + ' / 구매 ' + count(need(row, '구매')) + ' / ROAS ' + need(row, 'ROAS')];
    return [sp + ' / CTR ' + need(row, 'CTR') + ' / CPC ' + won(need(row, 'CPC')), '구매 ' + count(need(row, '구매')) + ' / ROAS ' + need(row, 'ROAS')];
  }
  function brChunks(groups, limit) {
    var pages = [], cur = [], n = 0;
    groups.forEach(function (g) {
      var cards = g.cards.slice();
      if (cur.length && cards.length > limit - n && cards.length <= limit) { pages.push(cur); cur = []; n = 0; }
      while (cards.length) {
        if (n === limit) { pages.push(cur); cur = []; n = 0; }
        var take = cards.slice(0, limit - n); cards = cards.slice(limit - n);
        cur.push({ title: g.title, cards: take }); n += take.length;
      }
    });
    if (cur.length) pages.push(cur);
    return pages;
  }
  function planBr(cc, blocks, cfg, W) {
    var bc = ((cfg.br || {})[cc]) || {}, withLen = !!bc.account_with_length, note = bc.note || '', slides = [];
    orderedBlocks(blocks, 'R').forEach(function (b) {
      var rows = b.rows;   // 표에는 카탈로그 포함, 카드(checked)에서만 뺀다
      var checked = rows.filter(function (r) { return (r.hi || r.lo) && !isCatalog(r); });
      if (!checked.length) return;
      var m = /CPAS-([A-Za-z]+)/.exec(b.campaign), chan = m ? m[1] : '';
      var topMode = ((b.flags || [])[0] || '').indexOf('소진량') >= 0, groups = [], anyLo = false;
      if (topMode) {
        var titles = ['▼ ' + cc + ' ' + b.detail + ' 캠페인 소진량 최상위 소재', '▼ ' + cc + ' ' + b.detail + ' 캠페인 평균 대비 유입 효율 (CTR, CPC) 우수 소재'];
        ['hi', 'lo'].forEach(function (which, i) {
          var cards = rows.filter(function (r) { return (which === 'hi' ? r.hi : r.lo) && !isCatalog(r); }).map(function (r) { return { account: '', kpi: brKpi('in', r), name: r.name, cls: 'hi' }; });
          if (cards.length) groups.push({ title: titles[i], cards: cards });
        });
        var both = rows.filter(function (r) { return r.hi && r.lo && !isCatalog(r); });
        if (both.length) W.push("BR '" + b.detail + "': 소진량 최상위·유입 고효율에 동시에 체크된 소재 " + both.length + '개 — 두 블록에 모두 넣음');
      } else {
        var keyed = {}, keys = [];
        checked.forEach(function (r) {
          if (r.hi && r.lo) W.push('BR 고효율·저효율에 동시에 체크: ' + r.name.slice(0, 50) + '… — 고효율로 처리');
          var c = classifyMemo(r.memo, r.hi ? 'hi' : 'lo');
          if (c[2]) W.push('BR ' + r.name.slice(0, 40) + '…: ' + c[2]);
          var k = c[0] + ':' + c[1];
          if (!keyed[k]) { keyed[k] = []; keys.push([c[0], c[1]]); }
          keyed[k].push({ account: '', kpi: brKpi(c[0], r), name: r.name, cls: c[1] });
        });
        keys.sort(function (a, b) { return (BR_TYPE_ORDER[a[0]] - BR_TYPE_ORDER[b[0]]) || ((a[1] === 'lo') - (b[1] === 'lo')); });
        keys.forEach(function (k) { groups.push({ title: '▼ 평균 대비 ' + BR_TYPE_TEXT[k[0]] + ' ' + (k[1] === 'hi' ? '우수' : '저조') + ' 소재', cards: keyed[k[0] + ':' + k[1]] }); if (k[1] === 'lo') anyLo = true; });
      }
      groups.forEach(function (g) { g.cards.forEach(function (c) {
        var acc = accountLabel(c.name, withLen);
        if (!acc) { W.push('BR 계정명을 소재명에서 찾지 못함 (Partnership_계정_해상도 형식 아님): ' + c.name.slice(0, 60) + ' — 소재명을 그대로 씀'); acc = c.name; }
        c.account = acc;
      }); });
      var suffix = b.detail.toLowerCase().indexOf('partnership') === 0 ? b.detail.slice('partnership'.length).replace(/^[-_ ]+/, '') : null;
      var pname = suffix === null ? b.detail : (topMode && suffix ? '파트너십-' + suffix : '파트너십');
      var head = cc + ' ' + (chan ? chan + ' ' : '') + '브랜딩 ' + pname + ' 캠페인 우수' + (anyLo ? ' <> 저조' : '') + ' 소재';
      var label = alias(cfg, 'table_label', cc, 'BR', 'R', b.detail) || b.detail, prefix = chan ? chan + '-CPAS ' : '';
      var table = { label: label, headers: b.headers, title: topMode ? '▼ ' + prefix + '<' + label + '> 소재 지출 금액 TOP ' + rows.length : '▼ ' + prefix + '<' + label + '> 소재별 주요 성과 (총 ' + rows.length + '건)',
        // ID형: '소진량 최상위' 행만 하늘색 / 메모형: 우수 연두·저조 분홍
        rows: rows.map(function (r) { return [r.name, b.headers.map(function (h) { return r.cells[h]; }), topMode ? (r.hi ? 'top' : '') : (r.hi ? 'hi' : (r.lo ? 'lo' : ''))]; }) };
      var pages = brChunks(groups, BR_MAX);
      if (pages.length > 1) W.push("BR '" + b.detail + "' 카드 " + groups.reduce(function (a, g) { return a + g.cards.length; }, 0) + '개 > ' + BR_MAX + ': ' + pages.length + '장으로 나눔 (표는 첫 장에만)');
      pages.forEach(function (pg, k) { slides.push({ title: head, groups: pg, note: note, table: k === 0 ? table : null }); });
    });
    return slides;
  }

  function planDeck(cc, kind, blocks, cfg) {
    cfg = cfg || {};
    var plan = { country: cc, kind: kind, slides: [], tables: [], br: [], warnings: [], infos: [] };
    var W = plan.warnings, zone = kind === 'OG' ? '상시' : '프로모션';
    // 체크박스가 둘 다 비었는데 행 메모에 '우수' 또는 '저조' 중 하나만 적혀 있으면 메모대로 넣는다 (체크 누락 보정, 10월 MY RT 사례)
    blocks.forEach(function (b) { if (b.na_only) return; b.rows.forEach(function (r) {
      if (r.hi || r.lo || !r.memo) return;
      var good = r.memo.indexOf('우수') >= 0, bad = r.memo.indexOf('저조') >= 0;
      if (good === bad) return;
      r.hi = good; r.lo = bad;
      W.push('체크 누락 보정: [' + b.detail + '] ' + r.name.slice(0, 50) + "… — 체크박스는 비었지만 메모('" + r.memo + "')대로 " + (good ? '우수' : '저조') + ' 로 넣음. 시트 체크를 확인해 주세요');
    }); });
    if (kind === 'OG') {
      var atcHi = pick(blocks, 'L', 'hi', 'atc', cfg, cc, kind, W), atcLo = pick(blocks, 'L', 'lo', 'atc', cfg, cc, kind, W);
      var hiNames = atcHi.map(function (s) { return s.name; });
      var both = atcLo.map(function (s) { return s.name; }).filter(function (n) { return hiNames.indexOf(n) >= 0; }).sort();
      if (both.length) W.push('우수·저조에 동시에 체크된 소재: [' + both.map(function (x) { return "'" + x + "'"; }).join(', ') + ']');
      var memos = [];
      blocks.forEach(function (b) { if (b.side === 'L') b.rows.forEach(function (r) { if (r.hi || r.lo) memos.push(r.memo); }); });
      var custom = memos.filter(function (m) { return !STD_ATC_MEMO.test(m); });
      if (atcHi.length || atcLo.length) {
        var cross = {};
        orderedBlocks(blocks, 'L').forEach(function (b) { b.rows.forEach(function (r) { if (r.hi || r.lo) cross[r.name] = r.memo; }); });
        var all = atcHi.concat(atcLo);
        if (custom.length) {
          all.forEach(function (s) { s.label = cross[s.name] || s.label; if (s.label.indexOf('<>') >= 0) s.cls = 'mix'; });
          var order = { hi: 0, mix: 1, lo: 2 };
          all = all.map(function (s, i) { return [s, i]; }).sort(function (a, b) { return (order[a[0].cls] - order[b[0].cls]) || (a[1] - b[1]); }).map(function (x) { return x[0]; });
          var title = cc + ' ' + zone + ' 캠페인(ATC) 유입/구매 효율 우수 <> 저조 소재';
          if (all.length <= 5) plan.slides.push(slide(title, all));
          else { plan.slides.push(slide(cc + ' ' + zone + ' 캠페인(ATC) 유입 효율 우수 소재', atcHi)); plan.slides.push(slide(cc + ' ' + zone + ' 캠페인(ATC) 유입 효율 저조 소재', atcLo)); }
        } else if (all.length <= 5 && atcHi.length && atcLo.length) {   // 한쪽만 있으면 분할하지 않고 아래에서 한 장으로
          plan.slides.push(slide(cc + ' ' + zone + ' 캠페인 유입 효율 우수 소재 <> 저조 소재', all,
            { split: true, n_hi: atcHi.length, n_lo: atcLo.length, group_labels: ['ATC 효율 우수 소재', 'ATC 효율 저조 소재'] }));
        } else {
          if (atcHi.length) plan.slides.push(slide(cc + ' ' + zone + ' 캠페인 유입 효율 우수 소재', atcHi));
          if (atcLo.length) plan.slides.push(slide(cc + ' ' + zone + ' 캠페인 유입 효율 저조 소재', atcLo));
        }
      }
      var purHi = pick(blocks, 'R', 'hi', 'pur', cfg, cc, kind, W), purLo = pick(blocks, 'R', 'lo', 'pur', cfg, cc, kind, W);
      if (purHi.length && purLo.length && purHi.length + purLo.length <= 5) {
        // 우수+저조 ≤5: 한 장. 캠페인(디테일)별로 묶고(캠페인 라벨 1개), 카드마다 '구매 효율 우수/저조' 표시 (10월 SG FN 형식)
        var order = [], byDetail = {};
        purHi.concat(purLo).forEach(function (sl) { if (!byDetail[sl.detail]) { byDetail[sl.detail] = []; order.push(sl.detail); } byDetail[sl.detail].push(sl); });
        var merged = [], groups = [];
        order.forEach(function (d) {
          var g = byDetail[d].filter(function (x) { return x.cls === 'hi'; }).concat(byDetail[d].filter(function (x) { return x.cls === 'lo'; }));
          g.forEach(function (x) { x.tag = x.cls === 'hi' ? '구매 효율 우수' : '구매 효율 저조'; });
          merged = merged.concat(g); groups.push({ label: g[0].label, n: g.length });
        });
        plan.slides.push(slide(cc + ' ' + zone + ' 캠페인 구매 효율 우수 <> 저조 소재', merged, { campaign_groups: groups }));
      } else {
        if (purHi.length) plan.slides.push(slide(cc + ' ' + zone + ' 캠페인 구매 효율 우수 소재', purHi));
        if (purLo.length) plan.slides.push(slide(cc + ' ' + zone + ' 캠페인 구매 효율 저조 소재', purLo));
      }
      // Tokopedia (ID 탭 세 번째 블록): 우수+저조 ≤5 면 한 장(양쪽 다 있으면 분할 배경), 넘으면 두 장
      var tkHi = pick(blocks, 'T', 'hi', 'pur', cfg, cc, kind, W), tkLo = pick(blocks, 'T', 'lo', 'pur', cfg, cc, kind, W);
      if (tkHi.length || tkLo.length) {
        if (tkHi.length + tkLo.length <= 5) {
          var bothSides = tkHi.length > 0 && tkLo.length > 0;
          plan.slides.push(slide(bothSides ? cc + ' ' + zone + ' 캠페인(Tokopedia) 구매 효율 우수 소재 <> 저조 소재'
                                           : cc + ' ' + zone + ' 캠페인(Tokopedia) 구매 효율 ' + (tkHi.length ? '우수' : '저조') + ' 소재',
            tkHi.concat(tkLo), { split: bothSides, n_hi: tkHi.length, n_lo: tkLo.length,
                                 group_labels: bothSides ? ['Tokopedia 구매 효율 우수 소재', 'Tokopedia 구매 효율 저조 소재'] : [] }));
        } else {
          if (tkHi.length) plan.slides.push(slide(cc + ' ' + zone + ' 캠페인(Tokopedia) 구매 효율 우수 소재', tkHi));
          if (tkLo.length) plan.slides.push(slide(cc + ' ' + zone + ' 캠페인(Tokopedia) 구매 효율 저조 소재', tkLo));
        }
      }
      plan.tables = tableSpecs(blocks, ['L', 'R', 'T'], cfg, cc, kind);
    } else {
      var hi = pick(blocks, 'L', 'hi', 'pur', cfg, cc, kind, W), lo = pick(blocks, 'L', 'lo', 'pur', cfg, cc, kind, W);
      if (hi.length) plan.slides.push(slide(cc + ' ' + zone + ' 캠페인 구매 효율 우수 소재', hi));
      if (lo.length) plan.slides.push(slide(cc + ' ' + zone + ' 캠페인 구매 효율 저조 소재', lo));
      plan.tables = tableSpecs(blocks, ['L'], cfg, cc, kind);
      plan.br = planBr(cc, blocks, cfg, W);
    }
    blocks.forEach(function (b) { if (b.note && b.rows.length && b.rows.some(function (r) { return r.hi || r.lo; })) plan.infos.push('시트 메모: [' + b.detail + '] ' + b.note); });
    plan.slides.forEach(function (s) { if (s.slots.length < 3) W.push("'" + s.title.trim() + "' 슬롯이 " + s.slots.length + '개 (3개 미만): 3슬롯 레이아웃에서 남는 자리를 지우고 만듭니다'); });
    return plan;
  }

  function splitSku(name) {
    var toks = name.split('_');
    if (toks.length <= 5) return [name];
    return [toks.slice(0, 5).join('_') + '_', toks.slice(5).join('_')];
  }

  var api = { parseBlocks: parseBlocks, planDeck: planDeck, splitSku: splitSku, manWon: manWon, accountLabel: accountLabel, classifyMemo: classifyMemo };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.CRPlan = api;
})(typeof window !== 'undefined' ? window : this);
